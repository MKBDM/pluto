  if(!f.checkValidity()){f.reportValidity();showErr('err_req');return}

  document.getElementById('t').value=String(Date.now()-started);
  var p=new URLSearchParams(new FormData(f));
  send.disabled=true;send.textContent=T[lang].sending;
  fetch(ENDPOINT,{method:'POST',mode:'no-cors',body:p}).then(function(){
    f.hidden=true;var dn=document.getElementById('done');dn.hidden=false;dn.scrollIntoView({block:'start',behavior:'smooth'});
  }).catch(function(){send.disabled=false;send.textContent=T[lang].send;showErr('err_send')});
});
})();
</script>
</body>
</html>
